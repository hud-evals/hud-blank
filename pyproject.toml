[project]
name = "hud-blank"
version = "0.1.0"
description = "A minimal HUD environment with letter counting and math expression scenarios"
requires-python = ">=3.11"
dependencies = [
    "hud-python>=0.5.0",
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["env.py", "tasks.py"]
